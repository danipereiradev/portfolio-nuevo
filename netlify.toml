  to = "/tiendas-online"
  status = 301
  force = true

# Cada ruta comercial sirve su propio index.html pre-renderizado,
# generado por scripts/prerender-meta.mjs tras el build.
# Las páginas locales publicadas viven en dist/diseno-web/{slug}/index.html
# (fichero estático: 200). Un slug no publicado no se genera: 404 de verdad.
[[redirects]]
  from = "/web-a-medida"
  to = "/diseno-web"
  status = 301
  force = true

[[redirects]]
  from = "/web-profesional-a-medida"
  to = "/landing-diseno-web"
  status = 301
  force = true

[[redirects]]
  from = "/landing-diseño-web"
  to = "/landing-diseno-web"
  status = 301
  force = true

[[redirects]]
  from = "/diseno-web"
  to = "/diseno-web/index.html"
  status = 200

# Ciudades no publicadas: HTTP 404. No redirigir a /diseno-web/ (soft 404).
# Las publicadas se sirven como fichero estático y ganan a esta regla.
[[redirects]]
  from = "/diseno-web/*"
  to = "/404.html"
  status = 404

