    <script>
      (function () {
        var ua = navigator.userAgent || '';
        if (
          /Android/i.test(ua) &&
          /Chrome|Chromium/i.test(ua) &&
          !/iPhone|iPad|iPod/.test(ua)
        ) {
          document.documentElement.classList.add('android-chrome');
        }
      })();
    </script>
    <!--hero-lcp-->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        try {
          path = decodeURIComponent(path);
        } catch (e) {}
        var images = {
          '/': '/video/hero-home-2.jpg',
        };
        var warm = {};
        var image = images[path];
        if (image) {
          document.documentElement.style.backgroundColor = '#141414';
          warm.img = new Image();
          warm.img.fetchPriority = 'high';
          warm.img.src = image;
        }
        if (path === '/') {
          warm.video = document.createElement('video');
          warm.video.preload = 'auto';
          warm.video.muted = true;
          warm.video.playsInline = true;
          warm.video.src = '/video/video%20home_2.mp4';
        }
        window.__36webHeroWarm = warm;
      })();
    </script>

    <!-- Excluir tráfico propio: ?noanalytics=1 (se guarda en este navegador).
         ?noanalytics=0 lo reactiva. Localhost no envía. -->
    <script>
      (function () {
        var KEY = '36web_exclude_analytics';
        var disabled = false;
        try {
          var params = new URLSearchParams(location.search);
          if (params.has('noanalytics')) {
            var on =
              params.get('noanalytics') !== '0' &&
              params.get('noanalytics') !== 'false';
            if (on) localStorage.setItem(KEY, '1');
            else localStorage.removeItem(KEY);
            params.delete('noanalytics');
            var query = params.toString();
            history.replaceState(
              null,
              '',
              location.pathname + (query ? '?' + query : '') + location.hash,
            );
          }
          disabled = localStorage.getItem(KEY) === '1';
        } catch (e) {}
        var host = location.hostname;
        if (
          host === 'localhost' ||
          host === '127.0.0.1' ||
          host === '[::1]' ||
          /\.local$/.test(host)
        ) {
          disabled = true;
        }
        if (!disabled) return;
        window.__36webNoAnalytics = true;
        window['ga-disable-G-V288FHTPLQ'] = true;
        window['ga-disable-AW-18305239496'] = true;
      })();
    </script>
    <script>
      (function () {
        if (window.__36webNoAnalytics) return;

        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-V288FHTPLQ';

        window.gtag('config', 'G-V288FHTPLQ');

      })();
    </script>
